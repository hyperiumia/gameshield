name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  schema:
    name: event-schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON Schema syntax
        run: python3 -m json.tool schemas/economic-event.v1.schema.json > /dev/null

  edge:
    name: edge · lua vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: cd edge/gameshield && lua5.4 src/sha2_test.lua

  ingest:
    name: ingest · cargo test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets

  engine:
    name: engine · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run pytest -q
